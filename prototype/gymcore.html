   (stroke="currentColor", 24x24 viewBox, rounded caps) so the whole app

   ========================================================================= */
function mkIcon(paths) {
  return function Icon({ size = 18, className = '', strokeWidth = 2, ...rest }) {
    return (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
           strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"
           className={className} {...rest}>
        {paths}
      </svg>
    );
  };
}

/* =========================================================================
   CONTEXT — shared app state (members, classes, toasts, theme, sound)
   ========================================================================= */
const AppCtx = createContext(null);
const useApp = () => useContext(AppCtx);

function AppProvider({ children }) {
  const [theme, setTheme] = useState('dark');
  const [members, setMembers] = useState(initialMembers);
  const [classes, setClasses] = useState(initialClasses);
  const [checkIns, setCheckIns] = useState(seedCheckIns);
  const [toasts, setToasts] = useState([]);
  const [muted, setMuted] = useState(false);
  const audioCtxRef = useRef(null);

  useEffect(() => {
    document.documentElement.classList.toggle('dark', theme === 'dark');
  }, [theme]);

  const pushToast = useCallback((message, type = 'success') => {
    const id = Math.random().toString(36).slice(2);
    setToasts(t => [...t, { id, message, type }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3200);
  }, []);

  const beep = useCallback((kind) => {
    if (muted) return;
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!audioCtxRef.current) audioCtxRef.current = new Ctx();
      const ctx = audioCtxRef.current;
      if (ctx.state === 'suspended') ctx.resume();
      const tone = (freq, start, dur) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = kind === 'granted' ? 'sine' : 'square';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, ctx.currentTime + start);
        gain.gain.exponentialRampToValueAtTime(0.28, ctx.currentTime + start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + start + dur);
        osc.connect(gain).connect(ctx.destination);
        osc.start(ctx.currentTime + start);
        osc.stop(ctx.currentTime + start + dur + 0.02);
      };
      if (kind === 'granted') { tone(880, 0, 0.16); tone(1320, 0.14, 0.22); }
      else { tone(200, 0, 0.18); tone(160, 0.2, 0.24); }
    } catch (e) { /* audio unavailable, fail silently */ }
  }, [muted]);

  const extendMembership = useCallback((id, days = 30) => {
    setMembers(ms => ms.map(m => m.id === id ? { ...m, status: 'active', daysRemaining: (m.daysRemaining < 0 ? 0 : m.daysRemaining) + days } : m));
    const m = members.find(m => m.id === id);
    pushToast(`Extended ${m ? m.name : 'member'}'s membership by ${days} days`, 'success');
  }, [members, pushToast]);

  const toggleFreeze = useCallback((id) => {
    setMembers(ms => ms.map(m => {
      if (m.id !== id) return m;
      const next = m.status === 'frozen' ? 'active' : 'frozen';
      pushToast(next === 'frozen' ? `${m.name}'s account frozen` : `${m.name}'s account resumed`, next === 'frozen' ? 'info' : 'success');
      return { ...m, status: next };
    }));
  }, [pushToast]);

  const toggleBooking = useCallback((classId, memberId) => {
    setClasses(cs => cs.map(c => {
      if (c.id !== classId) return c;
      const already = c.roster.includes(memberId);
      if (already) {
        pushToast(`Booking cancelled — ${c.name}`, 'info');
        return { ...c, booked: Math.max(0, c.booked - 1), roster: c.roster.filter(id => id !== memberId) };
      }
      if (c.booked >= c.capacity) return c;
      pushToast(`Spot booked — ${c.name}`, 'success');
      return { ...c, booked: c.booked + 1, roster: [...c.roster, memberId] };
    }));
  }, [pushToast]);

  const addClass = useCallback((cls) => {
    setClasses(cs => [...cs, { ...cls, id: 'c-' + Math.random().toString(36).slice(2, 7), booked: 0, roster: [] }]);
    pushToast(`Class "${cls.name}" created`, 'success');
  }, [pushToast]);

  const addCheckIn = useCallback((location) => {
    const hour = new Date().getHours();
    setCheckIns(ci => [...ci, { id: 'ci-live-' + Math.random().toString(36).slice(2, 7), hour, location }]);
  }, []);

  const value = {
    theme, setTheme,
    members, setMembers, extendMembership, toggleFreeze,
    classes, setClasses, toggleBooking, addClass,
    checkIns, addCheckIn,
    toasts, pushToast,
    muted, setMuted, beep,
  };
  return <AppCtx.Provider value={value}>{children}</AppCtx.Provider>;
}

/* =========================================================================
   LIVE QR CODE — pretty-fake, deterministic finder patterns + a randomized
   data field that reshuffles on an interval to sell a "refreshing for
   security" effect, plus an animated scan-line sweep overlay.
   ========================================================================= */
function LiveQR({ size = 180 }) {
  const GRID = 21;
  const [cells, setCells] = useState(() => Array.from({ length: GRID * GRID }, () => Math.random() > 0.55));
  const [refreshedAt, setRefreshedAt] = useState(new Date());
  const [code, setCode] = useState(() => Math.random().toString(16).slice(2, 8).toUpperCase());

  useEffect(() => {
    const id = setInterval(() => {
      setCells(Array.from({ length: GRID * GRID }, () => Math.random() > 0.55));
      setRefreshedAt(new Date());
      setCode(Math.random().toString(16).slice(2, 8).toUpperCase());
    }, 3000);
    return () => clearInterval(id);
  }, []);

  function isOn(r, c) {
    const corners = [[0, 0], [0, GRID - 7], [GRID - 7, 0]];
    for (const [r0, c0] of corners) {
      if (r >= r0 && r < r0 + 7 && c >= c0 && c < c0 + 7) {
        const rr = r - r0, cc = c - c0;
        if (rr === 0 || rr === 6 || cc === 0 || cc === 6) return true;
        if (rr >= 2 && rr <= 4 && cc >= 2 && cc <= 4) return true;
        return false;
      }
    }
    return cells[r * GRID + c];
  }

  return (
    <div className="inline-flex flex-col items-center gap-2">
      <div className="relative bg-white p-3 rounded-xl shadow-inner overflow-hidden" style={{ width: size, height: size }}>
        <div className="grid w-full h-full" style={{ gridTemplateColumns: `repeat(${GRID}, 1fr)` }}>
          {Array.from({ length: GRID * GRID }).map((_, i) => {
            const r = Math.floor(i / GRID), c = i % GRID;
            return <div key={i} className={isOn(r, c) ? 'bg-slate-900' : 'bg-transparent'} />;
          })}
        </div>
        <div className="qr-sweep absolute left-0 right-0 h-8 bg-gradient-to-b from-transparent via-brand-400/70 to-transparent" />
      </div>
      <div className="flex items-center gap-1.5 text-[11px] font-mono text-slate-500 dark:text-slate-400">
        <Icons.RefreshCw size={11} className="animate-spin" style={{ animationDuration: '3s' }} />
        <span>SEC-{code}</span>
        <span className="opacity-60">· refreshes every 3s</span>
      </div>
    </div>
  );
}

/* =========================================================================
   ADMIN — QR SCANNER SIMULATOR
   ========================================================================= */
function ScannerView() {
  const { members, addCheckIn, beep, muted, setMuted } = useApp();
  const [selected, setSelected] = useState(members[0].id);
  const [scanState, setScanState] = useState('idle'); // idle | scanning | result
  const [result, setResult] = useState(null);
  const [log, setLog] = useState([]);

  function runScan(memberId) {
    const member = members.find(m => m.id === memberId);
    if (!member) return;
    setScanState('scanning');
    setResult(null);
    setTimeout(() => {
      let decision, reason;
      if (member.status === 'active') { decision = 'granted'; reason = 'Active Membership'; }
      else if (member.status === 'frozen') { decision = 'denied'; reason = 'Account Frozen'; }
      else { decision = 'denied'; reason = 'Membership Expired'; }
      const res = { member, decision, reason, at: new Date() };
      setResult(res);
      setScanState('result');
      beep(decision);
      if (decision === 'granted') addCheckIn(member.location);
      setLog(l => [res, ...l].slice(0, 6));
    }, 850);
  }

  function randomScan() {
    const m = members[Math.floor(Math.random() * members.length)];
    setSelected(m.id);
    runScan(m.id);
  }

  return (
    <div className="grid xl:grid-cols-[1.2fr,1fr] gap-6">
      <div className="rounded-2xl bg-white dark:bg-slate-900 ring-1 ring-slate-900/10 dark:ring-white/10 p-6 flex flex-col">
        <div className="flex items-center justify-between mb-5">
          <h3 className="font-bold text-lg flex items-center gap-2"><Icons.ScanLine size={19} /> Front-Desk Scanner</h3>
          <button onClick={() => setMuted(m => !m)} title="Toggle scan sounds" className="p-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-500 hover:text-slate-800 dark:hover:text-slate-200">
            {muted ? <Icons.VolumeX size={16} /> : <Icons.Volume2 size={16} />}
          </button>
        </div>

        <div className={`relative rounded-2xl grid place-items-center min-h-[280px] mb-5 overflow-hidden transition-colors duration-300 ${
          scanState === 'result' && result
            ? result.decision === 'granted' ? 'bg-emerald-600' : 'bg-rose-600'
            : 'bg-slate-900 dark:bg-slate-950'}`}>
          {scanState === 'idle' && (
            <div className="text-center text-slate-400">
              <Icons.QrCode size={48} className="mx-auto mb-3 opacity-50" />
              <p className="text-sm">Awaiting scan…</p>
            </div>
          )}
          {scanState === 'scanning' && (
            <div className="text-center text-white">
              <div className="w-16 h-16 rounded-full border-4 border-white/20 border-t-white animate-spin mx-auto mb-3" />
              <p className="text-sm font-medium tracking-wide">Validating membership…</p>
            </div>
          )}
          {scanState === 'result' && result && (
            <div className="flash-pop text-center text-white px-6 py-8">
              {result.decision === 'granted'
                ? <Icons.CheckCircle2 size={64} className="mx-auto mb-3" />
                : <Icons.XCircle size={64} className="mx-auto mb-3" />}
              <p className="text-2xl font-extrabold tracking-tight">{result.decision === 'granted' ? 'ACCESS GRANTED' : 'ACCESS DENIED'}</p>
              <p className="font-medium opacity-90 mt-1">{result.reason}</p>
              <div className="mt-4 inline-flex items-center gap-2 bg-black/20 rounded-full px-4 py-1.5 text-sm">
                <Icons.User size={14} /> {result.member.name} · {result.member.location}
              </div>
              <div className="mt-2 flex items-center justify-center gap-1.5 text-xs opacity-80">
                {muted ? <Icons.VolumeX size={13} /> : <Icons.Volume2 size={13} className="animate-pulse" />}
                {muted ? 'Sound muted' : (result.decision === 'granted' ? 'Chime played' : 'Buzzer played')}
              </div>
            </div>
          )}
        </div>

        <div className="grid sm:grid-cols-[1fr,auto] gap-3">
          <select value={selected} onChange={e => setSelected(e.target.value)}
            className="px-3 py-2.5 rounded-xl text-sm bg-slate-50 dark:bg-slate-800 ring-1 ring-slate-900/10 dark:ring-white/10 outline-none focus:ring-2 focus:ring-brand-500">
            {members.map(m => <option key={m.id} value={m.id}>{m.name} — {m.location} ({m.status})</option>)}
          </select>
          <button onClick={() => runScan(selected)} className="px-4 py-2.5 rounded-xl bg-slate-800 dark:bg-slate-700 text-white text-sm font-semibold hover:bg-slate-900 dark:hover:bg-slate-600 whitespace-nowrap">
            Scan Selected
          </button>
        </div>
        <button onClick={randomScan} className="mt-3 w-full py-2.5 rounded-xl bg-brand-600 text-white text-sm font-bold hover:bg-brand-700 flex items-center justify-center gap-2">
          <Icons.ScanLine size={16} /> Simulate Member Scan
        </button>
      </div>

      <div className="rounded-2xl bg-white dark:bg-slate-900 ring-1 ring-slate-900/10 dark:ring-white/10 p-6">
        <h3 className="font-bold mb-4">Recent Scans</h3>
        {log.length === 0 && <p className="text-sm text-slate-400">No scans yet — try the simulator.</p>}
        <div className="flex flex-col gap-2">
          {log.map((r, i) => (
            <div key={i} className="flex items-center justify-between p-3 rounded-xl bg-slate-50 dark:bg-slate-800/60 text-sm">
              <div className="flex items-center gap-2.5">
                {r.decision === 'granted'
                  ? <Icons.ShieldCheck size={17} className="text-emerald-500 shrink-0" />
                  : <Icons.ShieldAlert size={17} className="text-rose-500 shrink-0" />}
                <div>
                  <p className="font-medium">{r.member.name}</p>
                  <p className="text-xs text-slate-500 dark:text-slate-400">{r.reason} · {r.member.location}</p>
                </div>
              </div>
              <span className="text-xs text-slate-400 font-mono">{r.at.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function OverviewView() {
  const { members, checkIns, classes } = useApp();
  const activeByLoc = LOCATIONS.map(l => ({ loc: l, count: members.filter(m => m.location === l && m.status === 'active').length }));
  const totalActive = members.filter(m => m.status === 'active').length;
  const todayCheckIns = checkIns.length;
  const buckets = useMemo(() => {
    const hours = [6, 7, 8, 9, 12, 17, 18, 19];
    return hours.map(h => ({ h, count: checkIns.filter(c => c.hour === h).length }));
  }, [checkIns]);
  const maxBucket = Math.max(...buckets.map(b => b.count), 1);
  const peak = buckets.reduce((a, b) => (b.count > a.count ? b : a), buckets[0]);
  const fullClasses = classes.filter(c => c.booked >= c.capacity).length;

  function fmtHour(h) {
    const period = h >= 12 ? 'PM' : 'AM';
    const hr = h % 12 === 0 ? 12 : h % 12;
    return `${hr}${period}`;
  }

  return (
    <div>
      <div className="grid sm:grid-cols-2 xl:grid-cols-4 gap-4 mb-6">
        <MetricCard icon={Icons.ScanLine} label="Today's Check-ins" value={todayCheckIns} sub="Across both locations" trend={8} />
        <MetricCard icon={Icons.Users} label="Active Memberships" value={totalActive} sub={`${activeByLoc[0].count} Downtown · ${activeByLoc[1].count} Northside`} trend={3} />
        <MetricCard icon={Icons.Clock} label="Peak Hour" value={fmtHour(peak.h)} sub={`${peak.count} check-ins in this window`} />
        <MetricCard icon={Icons.Calendar} label="Classes at Capacity" value={fullClasses} sub={`of ${classes.length} total classes`} trend={-2} />
      </div>

      <div className="grid lg:grid-cols-[1.4fr,1fr] gap-6">
        <div className="rounded-2xl bg-white dark:bg-slate-900 ring-1 ring-slate-900/10 dark:ring-white/10 p-6">
          <h3 className="font-bold mb-1 flex items-center gap-2"><Icons.BarChart3 size={17} /> Check-ins by Hour</h3>
          <p className="text-xs text-slate-400 mb-5">Live — updates as scans are simulated at the front desk</p>
          <div className="flex items-end gap-3 h-40">
            {buckets.map(b => (
              <div key={b.h} className="flex-1 flex flex-col items-center justify-end h-full gap-1.5">
                <span className="text-xs font-semibold text-slate-500 dark:text-slate-400">{b.count}</span>
                <div className={`w-full rounded-t-lg bar-grow ${b.h === peak.h && b.count > 0 ? 'bg-brand-500' : 'bg-slate-200 dark:bg-slate-700'}`}
                  style={{ height: `${Math.max(6, (b.count / maxBucket) * 100)}%` }} />
                <span className="text-[11px] text-slate-400">{fmtHour(b.h)}</span>
              </div>
            ))}
          </div>
        </div>

        <div className="flex flex-col gap-4">
          {LOCATIONS.map(loc => {
            const locMembers = members.filter(m => m.location === loc);
            const active = locMembers.filter(m => m.status === 'active').length;
            const checkins = checkIns.filter(c => c.location === loc).length;
            return (
              <div key={loc} className="rounded-2xl bg-white dark:bg-slate-900 ring-1 ring-slate-900/10 dark:ring-white/10 p-5">
                <div className="flex items-center gap-2 mb-3 font-bold"><Icons.Building2 size={17} /> {loc}</div>
                <div className="grid grid-cols-2 gap-3 text-sm">
                  <div>
                    <p className="text-2xl font-extrabold">{active}</p>
                    <p className="text-slate-500 dark:text-slate-400 text-xs">Active members</p>
                  </div>
                  <div>
                    <p className="text-2xl font-extrabold">{checkins}</p>
                    <p className="text-slate-500 dark:text-slate-400 text-xs">Check-ins today</p>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/* =========================================================================
   ADMIN DASHBOARD SHELL
   ========================================================================= */
function AdminDashboard() {
  const [nav, setNav] = useState('overview');
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const navItems = [
    { id: 'overview', label: 'Analytics Overview', icon: Icons.LayoutDashboard },
    { id: 'scanner', label: 'QR Scanner', icon: Icons.ScanLine },
    { id: 'members', label: 'Member Management', icon: Icons.Users },
    { id: 'classes', label: 'Class & Capacity', icon: Icons.Calendar },
  ];
  const activeLabel = navItems.find(n => n.id === nav)?.label;

  return (
    <div className="grid lg:grid-cols-[240px,1fr] gap-6">
      <aside className={`lg:sticky lg:top-6 lg:h-fit ${sidebarOpen ? 'block' : 'hidden'} lg:block`}>
        <div className="rounded-2xl bg-white dark:bg-slate-900 ring-1 ring-slate-900/10 dark:ring-white/10 p-3 flex lg:flex-col gap-1 overflow-x-auto no-scrollbar">
          {navItems.map(n => (
            <button key={n.id} onClick={() => { setNav(n.id); setSidebarOpen(false); }}
              className={`flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl text-sm font-semibold transition-colors whitespace-nowrap ${
                nav === n.id ? 'bg-brand-600 text-white' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'}`}>
              <n.icon size={16} /> {n.label}
            </button>
          ))}
        </div>
      </aside>

      <main>
        <div className="flex items-center justify-between mb-5 lg:hidden">
          <h2 className="font-bold text-lg">{activeLabel}</h2>
          <button onClick={() => setSidebarOpen(s => !s)} className="p-2 rounded-lg bg-white dark:bg-slate-900 ring-1 ring-slate-900/10 dark:ring-white/10">
            <Icons.Menu size={18} />
          </button>
        </div>
        <h2 className="font-bold text-xl mb-5 hidden lg:block">{activeLabel}</h2>
        {nav === 'overview' && <OverviewView />}
        {nav === 'scanner' && <ScannerView />}
        {nav === 'members' && <MembersView />}
        {nav === 'classes' && <ClassManagerView />}
      </main>
    </div>
  );
}

/* =========================================================================
   ROOT APP
   ========================================================================= */
function TopBar({ view, setView }) {
  const { theme, setTheme } = useApp();
  return (
    <header className="sticky top-0 z-40 backdrop-blur bg-slate-100/80 dark:bg-slate-950/80 border-b border-slate-900/5 dark:border-white/5">
      <div className="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex flex-wrap items-center justify-between gap-4">
        <div className="flex items-center gap-2 font-extrabold text-xl tracking-tight text-slate-900 dark:text-white">
          <div className="w-9 h-9 rounded-xl bg-brand-600 text-white grid place-items-center"><Icons.Dumbbell size={19} /></div>
          GymCore
        </div>

        <div className="flex items-center gap-2 bg-white dark:bg-slate-900 ring-1 ring-slate-900/10 dark:ring-white/10 p-1 rounded-xl">
          <button onClick={() => setView('client')}
            className={`flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg text-sm font-semibold transition-colors ${view === 'client' ? 'bg-brand-600 text-white' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'}`}>
            <Icons.User size={15} /> Client Portal
          </button>
          <button onClick={() => setView('admin')}
            className={`flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg text-sm font-semibold transition-colors ${view === 'admin' ? 'bg-brand-600 text-white' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'}`}>
            <Icons.LayoutDashboard size={15} /> Staff / Admin Dashboard
          </button>
        </div>

        <button onClick={() => setTheme(t => t === 'dark' ? 'light' : 'dark')}
          className="p-2.5 rounded-xl bg-white dark:bg-slate-900 ring-1 ring-slate-900/10 dark:ring-white/10 text-slate-600 dark:text-slate-300 hover:text-brand-600 dark:hover:text-brand-400">
          {theme === 'dark' ? <Icons.Sun size={17} /> : <Icons.Moon size={17} />}
        </button>
      </div>
    </header>
  );
}

function App() {
  const [view, setView] = useState('client');
  return (
    <AppProvider>
      <div className="min-h-screen">
        <TopBar view={view} setView={setView} />
        <div className="max-w-7xl mx-auto px-4 sm:px-6 py-8">
          {view === 'client' ? <ClientPortal /> : <AdminDashboard />}
        </div>
        <ToastStack />
      </div>
    </AppProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
