# Local dev stack. `docker compose up` brings up Postgres + the API;
# `npm run dev` in web/ (or a frontend service, once containerized) talks
# to the API through its own dev proxy — see web/vite.config.ts.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: powerlife
      POSTGRES_PASSWORD: powerlife_dev_pw
      POSTGRES_DB: powerlife
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U powerlife"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: { context: ., dockerfile: Dockerfile }
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://powerlife:powerlife_dev_pw@db:5432/powerlife?sslmode=disable
      HTTP_ADDR: ":8080"
      JWT_SECRET: dev-only-secret-not-for-prod-min-32-bytes-xxxxx
      CORS_ORIGIN: http://localhost:5173
      APP_ENV: development
    ports: ["8080:8080"]

volumes:
  pgdata:
