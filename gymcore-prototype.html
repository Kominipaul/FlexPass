/* ============================================================================
   1. Icons — React wrapper over the Lucide UMD set
   ========================================================================== */
const pascal = (n) => n.split("-").map((p) => p.charAt(0).toUpperCase() + p.slice(1)).join("");
function lookupIcon(name) {
  const L = window.lucide;
  if (!L) return null;
  const key = pascal(name);
  const bag = L.icons || L;
  return bag[key] || bag[name] || L[key] || L[name] || null;
}
const camel = (k) => k.replace(/-([a-z])/g, (_, c) => c.toUpperCase());

function Icon({ name, size = 16, strokeWidth = 2, className = "", title }) {
  const node = lookupIcon(name);
  const base = {
    width: size, height: size, viewBox: "0 0 24 24", fill: "none",
    stroke: "currentColor", strokeWidth, strokeLinecap: "round", strokeLinejoin: "round",
    className: "shrink-0 " + className, "aria-hidden": title ? undefined : true,
    role: title ? "img" : undefined, focusable: "false"
  };
  if (!node) return <svg {...base}><circle cx="12" cy="12" r="9" /></svg>;
  const parts = node[0] === "svg" ? node[2] : node;
  const children = (parts || []).map(([tag, attrs], i) => {
    const props = { key: i };
    Object.keys(attrs || {}).forEach((k) => { props[camel(k)] = attrs[k]; });
    return React.createElement(tag, props);
  });
  return <svg {...base}>{title ? <title>{title}</title> : null}{children}</svg>;
}

/* ============================================================================
   4. Derived state
   ========================================================================== */
function statusOf(m) {
  if (m.frozen) return "frozen";
  if (m.daysLeft <= 0) return "expired";
  if (m.daysLeft <= 7) return "expiring";
  return "active";
}
const STATUS_META = {
  active:   { icon: "check-circle-2", fg: "text-good",  bg: "bg-goodsoft" },
  expiring: { icon: "alert-triangle", fg: "text-warn",  bg: "bg-warnsoft" },
  expired:  { icon: "x-circle",       fg: "text-bad",   bg: "bg-badsoft" },
  frozen:   { icon: "snowflake",      fg: "text-froze", bg: "bg-frozesoft" }
};

/** The rule the door actually runs — plan tier decides which space opens. */
function evaluateAccess(member, atLoc) {
  const plan = PLANS[member.plan];
  const st = statusOf(member);
  if (st === "expired") return { ok: false, reasonKey: "rExpired" };
  if (st === "frozen")  return { ok: false, reasonKey: "rFrozen" };
  if (atLoc === "pil" && !plan.pilates) return { ok: false, reasonKey: "rNoPilates" };
  if (st === "expiring") return { ok: true, reasonKey: "rExpiring", days: member.daysLeft };
  return { ok: true, reasonKey: "rActive" };
}
function reasonText(t, entry, member) {
  const k = entry.reasonKey;
  if (k === "rExpiring") {
    const d = entry.days != null ? entry.days : (member ? member.daysLeft : 0);
    return t("rExpiring") + " " + d + " " + t("rDays");
  }
  if (k === "rActive" && member) return t("rActive") + " · " + PLANS[member.plan].label[t.lang];
  return t(k);
}

/** Can this plan book this class? */
function canBook(member, cls) {
  const plan = PLANS[member.plan];
  if (DISCIPLINES[cls.disc].pilatesOnly) return plan.pilates;
  return plan.classes;
}

const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);

/* ============================================================================
   5. Primitives
   ========================================================================== */
function Button({ variant = "solid", size = "md", icon, iconRight, children, className = "", ...rest }) {
  const sizes = { sm: "h-8 px-3 text-[11px] gap-1.5", md: "h-9 px-3.5 text-[11.5px] gap-2", lg: "h-11 px-5 text-[13px] gap-2" };
  const variants = {
    solid:  "bg-volt text-voltink border border-volt hover:shadow-glow active:brightness-95",
    ember:  "bg-ember text-white border border-ember hover:brightness-110",
    quiet:  "bg-raised text-ink border border-line hover:border-voltline hover:text-volt",
    ghost:  "bg-transparent text-dim border border-transparent hover:bg-raised hover:text-ink",
    danger: "bg-badsoft text-bad border border-badsoft hover:brightness-125",
    good:   "bg-goodsoft text-good border border-goodsoft hover:brightness-125"
  };
  return (
    <button
      className={"display font-bold uppercase tracking-[.08em] inline-flex items-center justify-center rounded-[6px] transition-all duration-150 disabled:opacity-40 disabled:pointer-events-none " +
        sizes[size] + " " + variants[variant] + " " + className}
      {...rest}
    >
      {icon && <Icon name={icon} size={size === "lg" ? 17 : 14} strokeWidth={2.3} />}
      {children}
      {iconRight && <Icon name={iconRight} size={size === "lg" ? 17 : 14} strokeWidth={2.3} />}
    </button>
  );
}

function StatusPill({ status, size = "md" }) {
  const { t } = useL();
  const m = STATUS_META[status];
  const pad = size === "sm" ? "h-5 px-1.5 text-[10px] gap-1" : "h-6 px-2 text-[10.5px] gap-1.5";
  return (
    <span className={"display font-bold uppercase tracking-[.06em] inline-flex items-center rounded-full whitespace-nowrap " + pad + " " + m.bg + " " + m.fg}>
      <Icon name={m.icon} size={size === "sm" ? 11 : 12} strokeWidth={2.6} />{t(status)}
    </span>
  );
}

function Card({ children, className = "", as: Tag = "div", ...rest }) {
  return <Tag className={"bg-surface border border-line rounded-[12px] shadow-card inner-top " + className} {...rest}>{children}</Tag>;
}

function SectionTitle({ children, hint, action }) {
  return (
    <div className="flex items-end justify-between gap-4 mb-3">
      <div>
        <h2 className="display text-[15px] font-bold uppercase tracking-[.04em]">{children}</h2>
        {hint && <p className="text-[12px] text-dim mt-0.5 normal-case">{hint}</p>}
      </div>
      {action}
    </div>
  );
}

function Field({ label, children, hint }) {
  return (
    <label className="block">
      <span className="eyebrow text-mute block mb-1.5">{label}</span>
      {children}
      {hint && <span className="block text-[11px] text-mute mt-1">{hint}</span>}
    </label>

/* ============================================================================
   6. Door pass — rotating token + canvas QR
   ========================================================================== */
function hashSeed(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function rng(seed) {
  let s = seed || 1;
  return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
}
function makeToken() {
  const alphabet = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  const block = () => Array.from({ length: 4 }, () => alphabet[Math.floor(Math.random() * alphabet.length)]).join("");
  return ["PLG", block(), block(), block()].join("-");
}

function QrCode({ token, px = 190 }) {
  const ref = useRef(null);
  useEffect(() => {
    const cv = ref.current;
    if (!cv) return;
    const dpr = window.devicePixelRatio || 1;
    const N = 29, quiet = 2, total = N + quiet * 2, cell = px / total;
    cv.width = px * dpr; cv.height = px * dpr;
    const ctx = cv.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0, 0, px, px);
    ctx.fillStyle = "#07080A";
    const rand = rng(hashSeed(token));
    const isFinder = (x, y) =>
      (x < 7 && y < 7) || (x >= N - 7 && y < 7) || (x < 7 && y >= N - 7) ||
      (x >= N - 9 && x <= N - 5 && y >= N - 9 && y <= N - 5);
    const dot = (x, y, on) => { if (on) ctx.fillRect((x + quiet) * cell, (y + quiet) * cell, cell * 0.92, cell * 0.92); };
    for (let y = 0; y < N; y++)
      for (let x = 0; x < N; x++)
        if (!isFinder(x, y)) dot(x, y, rand() > 0.52);
    for (let i = 8; i < N - 8; i++) { dot(i, 6, i % 2 === 0); dot(6, i, i % 2 === 0); }
    const eye = (ox, oy, size) => {
      ctx.fillRect((ox + quiet) * cell, (oy + quiet) * cell, cell * size, cell * size);
      ctx.fillStyle = "#FFFFFF";
      ctx.fillRect((ox + 1 + quiet) * cell, (oy + 1 + quiet) * cell, cell * (size - 2), cell * (size - 2));
      ctx.fillStyle = "#07080A";
      ctx.fillRect((ox + 2 + quiet) * cell, (oy + 2 + quiet) * cell, cell * (size - 4), cell * (size - 4));
    };
    eye(0, 0, 7); eye(N - 7, 0, 7); eye(0, N - 7, 7); eye(N - 9, N - 9, 5);
  }, [token, px]);
  return <canvas ref={ref} style={{ width: px, height: px }} className="block rounded-[3px]" aria-label="Access pass QR" role="img" />;
}

function beep(kind, muted) {
  if (muted) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = new AC();
    const now = ctx.currentTime;
    const notes = kind === "granted" ? [[880, 0], [1320, 0.09]] : [[220, 0], [165, 0.12]];
    notes.forEach(([freq, at]) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = kind === "granted" ? "sine" : "square";
      osc.frequency.setValueAtTime(freq, now + at);
      gain.gain.setValueAtTime(0.0001, now + at);
      gain.gain.exponentialRampToValueAtTime(0.16, now + at + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + at + 0.16);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now + at); osc.stop(now + at + 0.2);
    });
    setTimeout(() => ctx.close(), 600);
  } catch (e) { /* audio unavailable — the visual indicator still fires */ }
}

          className={"w-[3px] rounded-full a-bar " + (tone === "granted" ? "bg-good" : "bg-bad")} />
      ))}
    </span>
  );
}

function Scanner({ members, atLoc, onResult, muted, setMuted, scans }) {

  const [phase, setPhase] = useState("idle");
  const [result, setResult] = useState(null);
  const timers = useRef([]);
  useEffect(() => () => timers.current.forEach(clearTimeout), []);

  const runScan = (memberId) => {
    const member = members.find((m) => m.id === memberId);
    if (!member) return;
    timers.current.forEach(clearTimeout);
    setPhase("scanning"); setResult(null);
    timers.current = [
      setTimeout(() => {
        const verdict = evaluateAccess(member, atLoc);
        const entry = {
          id: "s" + Date.now(), memberId: member.id, loc: atLoc, time: clock(),
          result: verdict.ok ? "granted" : "denied", reasonKey: verdict.reasonKey, days: verdict.days
        };
        setResult({ member, verdict, entry });
        setPhase("result");
        beep(verdict.ok ? "granted" : "denied", muted);
        onResult(entry);
      }, 950),
      setTimeout(() => setPhase("idle"), 7000)
    ];
  };
  const randomScan = () => {
    const m = members[Math.floor(Math.random() * members.length)];

        <div className="p-5 min-h-[340px] grid place-items-center text-center">

              <p className="text-[12px] text-dim mt-1.5 max-w-xs mx-auto">{t("waitingHint")}</p>

function barPath(x, y, w, h, r) {
  const rr = Math.max(0, Math.min(r, w / 2, h));
  return "M" + x + "," + (y + h) + "V" + (y + rr) + "a" + rr + "," + rr + " 0 0 1 " + rr + ",-" + rr +
         "h" + (w - 2 * rr) + "a" + rr + "," + rr + " 0 0 1 " + rr + "," + rr + "V" + (y + h) + "Z";
}
function ChartTooltip({ x, y, children }) {
  return (
    <div className="pointer-events-none absolute z-20 -translate-x-1/2 -translate-y-full px-2.5 py-1.5 rounded-[6px] bg-raised border border-line shadow-lift text-[11.5px] whitespace-nowrap"
      style={{ left: x, top: y - 8 }}>{children}</div>
  );
}

function PeakHoursChart({ data, scope }) {
  const { t } = useL();
  const [hover, setHover] = useState(null);
  const W = 720, H = 190, padL = 30, padR = 8, padT = 16, padB = 26;
  const vals = data.map((d) => (scope === "all" ? d.art + d.pil : d[scope]));
  const max = Math.max(...vals, 1);
  const peakIdx = vals.indexOf(Math.max(...vals));
  const iw = (W - padL - padR) / data.length;
  const bw = iw - 4;
  const ticks = [0, Math.round(max / 2), max];

  return (
    <div className="relative">
      <svg viewBox={"0 0 " + W + " " + H} className="w-full h-[190px]" role="img" aria-label={t("trafficByHour")}>
        {ticks.map((tick) => {
          const y = padT + (1 - tick / max) * (H - padT - padB);
          return (
            <g key={tick}>
              <line x1={padL} x2={W - padR} y1={y} y2={y} stroke="var(--grid)" strokeWidth="1" />
              <text x={padL - 6} y={y + 3.5} textAnchor="end" fontSize="9.5" fill="var(--mute)" className="mono">{tick}</text>
            </g>
          );
        })}
        {data.map((d, i) => {
          const v = vals[i];
          const h = (v / max) * (H - padT - padB);
          const x = padL + i * iw + 2;
          const y = padT + (H - padT - padB - h);
          const isPeak = i === peakIdx;
          return (
            <g key={d.hour} onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover(null)}>
              <rect x={padL + i * iw} y={padT} width={iw} height={H - padT - padB} fill="transparent" />
              <path d={barPath(x, y, bw, h, 4)} fill={isPeak ? "var(--volt)" : "var(--s1)"}
                opacity={hover === null || hover === i ? (isPeak ? 1 : 0.78) : 0.34} style={{ transition: "opacity .15s" }} />
              {isPeak && <text x={x + bw / 2} y={y - 5} textAnchor="middle" fontSize="10" fontWeight="700" fill="var(--ink)" className="mono">{v}</text>}
              {i % 3 === 0 && <text x={x + bw / 2} y={H - 8} textAnchor="middle" fontSize="9.5" fill="var(--mute)" className="mono">{String(d.hour).padStart(2, "0")}</text>}
            </g>
          );
        })}
      </svg>
      {hover !== null && (
        <ChartTooltip x={((padL + hover * iw + iw / 2) / W) * 100 + "%"} y={40}>
          <span className="mono font-semibold">{String(data[hover].hour).padStart(2, "0")}:00</span>
          <span className="text-dim"> · </span><span className="mono">{vals[hover]}</span>
        </ChartTooltip>
      )}
    </div>
  );
}

function WeekChart({ data }) {
  const { t, tx } = useL();
  const [hover, setHover] = useState(null);
  const W = 720, H = 190, padL = 34, padR = 8, padT = 20, padB = 26;
  const max = Math.max(...data.map((d) => Math.max(d.art, d.pil)), 1);
  const gw = (W - padL - padR) / data.length;
  const bw = (gw - 10) / 2;
  const ticks = [0, Math.round(max / 2), max];

  return (
    <div className="relative">
      <div className="flex items-center gap-4 mb-1.5">
        {LOCATIONS.map((l, i) => (
          <span key={l.id} className="inline-flex items-center gap-1.5 text-[11.5px] text-dim">
            <span className="w-2.5 h-2.5 rounded-[2px]" style={{ background: i === 0 ? "var(--s1)" : "var(--s2)" }} />{tx(l.tag)}
          </span>
        ))}
      </div>
      <svg viewBox={"0 0 " + W + " " + H} className="w-full h-[190px]" role="img" aria-label={t("clubCompare")}>
        {ticks.map((tick) => {
          const y = padT + (1 - tick / max) * (H - padT - padB);
          return (
            <g key={tick}>
              <line x1={padL} x2={W - padR} y1={y} y2={y} stroke="var(--grid)" strokeWidth="1" />
              <text x={padL - 6} y={y + 3.5} textAnchor="end" fontSize="9.5" fill="var(--mute)" className="mono">{tick}</text>
            </g>
          );
        })}
        {data.map((d, i) => {
          const base = padL + i * gw + 5;
          const last = i === data.length - 1;
          return (
            <g key={i} onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover(null)}>
              <rect x={padL + i * gw} y={padT} width={gw} height={H - padT - padB} fill="transparent" />
              {[["art", "var(--s1)", 0], ["pil", "var(--s2)", bw + 2]].map(([key, color, off]) => {
                const h = (d[key] / max) * (H - padT - padB);
                const y = padT + (H - padT - padB - h);
                return (
                  <g key={key}>
                    <path d={barPath(base + off, y, bw, h, 4)} fill={color} opacity={hover === null || hover === i ? 1 : 0.35} style={{ transition: "opacity .15s" }} />
                    {last && d[key] > 0 && <text x={base + off + bw / 2} y={y - 5} textAnchor="middle" fontSize="10" fontWeight="700" fill="var(--ink)" className="mono">{d[key]}</text>}
                  </g>
                );
              })}
              <text x={base + bw + 1} y={H - 8} textAnchor="middle" fontSize="9.5" fill="var(--mute)">{tx(d.day)}</text>
            </g>
          );
        })}
      </svg>
      {hover !== null && (
        <ChartTooltip x={((padL + hover * gw + gw / 2) / W) * 100 + "%"} y={54}>
          <span className="font-semibold">{tx(data[hover].day)}</span>
          <span className="mono block text-dim">ART {data[hover].art} · PIL {data[hover].pil}</span>
        </ChartTooltip>
      )}
    </div>
  );
}

function MetricCard({ icon, label, value, sub, tone = "volt" }) {
  const toneCls = {
    volt: "text-volt bg-voltsoft border-voltline", good: "text-good bg-goodsoft border-goodsoft",
    warn: "text-warn bg-warnsoft border-warnsoft", bad: "text-bad bg-badsoft border-badsoft"

function Analytics({ members, classes, scans, checkinsToday, scope }) {
  const { t, tx } = useL();
  const active = members.filter((m) => ["active", "expiring"].includes(statusOf(m)));
  const totals = HOURLY_SEED.map((d) => (scope === "all" ? d.art + d.pil : d[scope]));
  const peak = HOURLY_SEED[totals.indexOf(Math.max(...totals))];
  const denied = scans.filter((s) => s.result === "denied").length;
  const capTotal = classes.reduce((a, c) => a + c.cap, 0);
  const bookedTotal = classes.reduce((a, c) => a + c.booked, 0);
  const revenue = members.reduce((a, m) => a + PLANS[m.plan].price, 0);

  return (
    <div className="space-y-4">
      <div className="grid sm:grid-cols-2 xl:grid-cols-4 gap-3">
        <MetricCard icon="door-open" label={t("checkinsToday")} value={checkinsToday} sub={t("vsLast")} />
        <MetricCard icon="users" label={t("activeMembers")} value={active.length} tone="good"
          sub={LOCATIONS.map((l) => l.short + " " + active.filter((m) => m.home === l.id).length).join("  ·  ")} />
        <MetricCard icon="trending-up" label={t("peakHour")} value={String(peak.hour).padStart(2, "0") + ":00"}
          sub={(scope === "all" ? peak.art + peak.pil : peak[scope]) + " " + t("inThatHour")} />
        <MetricCard icon="scan-line" label={t("refused")} value={denied} tone={denied ? "bad" : "good"}
          sub={denied ? t("refusedHint") : t("allCleared")} />
      </div>

      <div className="grid xl:grid-cols-2 gap-3">
        <Card className="p-4">
          <SectionTitle hint={scope === "all" ? t("bothCombined") : tx(LOCATIONS.find((l) => l.id === scope).tag) + " · " + t("today").toLowerCase()}>{t("trafficByHour")}</SectionTitle>
          <PeakHoursChart data={HOURLY_SEED} scope={scope} />
        </Card>
        <Card className="p-4">
          <SectionTitle hint={t("last7")}>{t("clubCompare")}</SectionTitle>
          <WeekChart data={WEEK_SEED} />
        </Card>
      </div>

      <div className="grid sm:grid-cols-3 gap-3">
        <Card className="p-4">
          <span className="eyebrow text-mute">{t("fillRate")}</span>
          <p className="display text-[30px] font-extrabold mt-2 tnum">{pct(bookedTotal, capTotal)}%</p>
          <p className="text-[11.5px] text-dim mb-2.5">{bookedTotal} {t("bookedOf")} {capTotal} {t("spotsWord")}</p>
          <Meter value={bookedTotal} max={capTotal} tone="volt" height="h-2" />
        </Card>
        <Card className="p-4 sm:col-span-2">
          <div className="flex items-baseline justify-between">
            <span className="eyebrow text-mute">{t("mix")}</span>
            <span className="mono text-[12px] text-volt font-semibold">{euro(revenue)} / {t("perMonth")}</span>
          </div>
          <div className="mt-3 space-y-2">
            {PLAN_ORDER.map((id) => {
              const p = PLANS[id];
              const n = members.filter((m) => m.plan === id).length;
              return (
                <div key={id} className="flex items-center gap-3">
                  <span className="text-[12px] w-36 shrink-0 truncate">{tx(p.label)}</span>
                  <div className="flex-1"><Meter value={n} max={members.length} tone="s1" /></div>
                  <span className="mono text-[12px] w-20 text-right">{n} · {euro(n * p.price)}</span>
                </div>
              );
            })}
          </div>
        </Card>
      </div>
    </div>
  );
}

  const [members, setMembers] = useState(MEMBER_SEED);
  const [classes, setClasses] = useState(() => CLASS_SEED.map((c) => ({ ...c, roster: c.roster.map((i) => MEMBER_SEED[i].id) })));
  const [scans, setScans] = useState(SCAN_SEED);
  const [toasts, setToasts] = useState([]);
  const [extendFor, setExtendFor] = useState(null);
  const [extendDays, setExtendDays] = useState(30);
  const [rosterFor, setRosterFor] = useState(null);
  const [memberFor, setMemberFor] = useState(null);
  const [upgradeTo, setUpgradeTo] = useState(null);

  const ctx = useMemo(() => {
    const t = (k) => (STR[lang][k] !== undefined ? STR[lang][k] : (STR.en[k] !== undefined ? STR.en[k] : k));
    t.lang = lang;
    const tx = (v) => (v && typeof v === "object" && !Array.isArray(v) ? (v[lang] !== undefined ? v[lang] : v.en) : v);
    return { lang, t, tx };
  }, [lang]);
  const { t, tx } = ctx;

  const me = members.find((m) => m.id === ME_ID);
  const myBookings = useMemo(() => classes.filter((c) => c.roster.includes(ME_ID)).map((c) => c.id), [classes]);
  const lastScan = useMemo(() => scans.find((s) => s.memberId === ME_ID), [scans]);

  const baseCheckins = useMemo(() => HOURLY_SEED.reduce((a, d) => a + d[atLoc], 0), [atLoc]);
  const liveGrants = scans.filter((s) => s.live && s.result === "granted" && s.loc === atLoc).length;
  const checkinsToday = baseCheckins + liveGrants;

  const toast = useCallback((title, body, tone) => {
    const id = Math.random().toString(36).slice(2);
    setToasts((ts) => [...ts, { id, title, body, tone }]);
    setTimeout(() => setToasts((ts) => ts.filter((x) => x.id !== id)), 3800);
  }, []);
  const dismiss = (id) => setToasts((ts) => ts.filter((x) => x.id !== id));
  const patchMember = (id, patch) => setMembers((ms) => ms.map((m) => (m.id === id ? { ...m, ...patch } : m)));

  const actions = {
    requestPt: () => toast(t("ptDone"), t("ptDoneBody")),
    freeze: (weeks) => { patchMember(ME_ID, { frozen: true }); toast(t("frozenToast"), t("freezeFor") + " " + weeks + " " + t("weeks"), "warn"); },
    unfreeze: () => { patchMember(ME_ID, { frozen: false }); toast(t("unfrozenToast"), t("unfrozenBody")); },
    renew: () => { patchMember(ME_ID, { daysLeft: me.daysLeft + 30 }); toast(t("renewToast"), t("charged") + " " + euro(PLANS[me.plan].price)); },
    toggleBooking: (classId) => {
      setClasses((cs) => cs.map((c) => {
        if (c.id !== classId) return c;
        const title = classTitle(c, tx);
        if (c.roster.includes(ME_ID)) {
          toast(t("cancelToast"), title + " · " + t(c.day) + " " + c.start, "warn");
          return { ...c, booked: Math.max(0, c.booked - 1), roster: c.roster.filter((x) => x !== ME_ID) };
        }
        if (c.booked >= c.cap) { toast(t("waitToast"), t("waitToastBody"), "warn"); return c; }
        toast(t("bookedToast"), title + " · " + t(c.day) + " " + c.start);
        return { ...c, booked: c.booked + 1, roster: [...c.roster, ME_ID] };
      }));
    },
    upgradeForClass: (cls) => setUpgradeTo(PLANS[DISCIPLINES[cls.disc].pilatesOnly ? "premium" : "group"]),
    openUpgrade: (plan) => setUpgradeTo(plan),
    logScan: (entry) => {
      setScans((s) => [{ ...entry, live: true }, ...s].slice(0, 40));
      if (entry.result === "granted") {
        patchMember(entry.memberId, { lastCheckIn: { el: "Σήμερα · " + entry.time, en: "Today · " + entry.time } });
      }
    },
    openExtend: (m) => { setExtendDays(30); setExtendFor(m); },
    toggleFreeze: (m) => {
      patchMember(m.id, { frozen: !m.frozen });
      toast(m.frozen ? t("accountUnfrozen") : t("accountFrozen"), tx(m.name) + " · " + m.id, m.frozen ? "good" : "warn");
    },
    openMember: (m) => setMemberFor(m),
    addClass: (draft) => {
      const id = "c" + Date.now();
      const { title, ...rest } = draft;
      setClasses((cs) => [...cs, { ...rest, id, name: { el: title, en: title }, booked: 0, roster: [] }]);
      toast(t("classPublished"), title + " · " + t(draft.day) + " " + draft.start);
    },
    dropClass: (id) => {
      const c = classes.find((x) => x.id === id);
      setClasses((cs) => cs.filter((x) => x.id !== id));
      toast(t("classCancelled"), classTitle(c, tx) + " — " + c.booked + " " + t("notified"), "warn");
    },
    openRoster: (c) => setRosterFor(c)
  };

  // Greek uppercasing drops the tonos (ΜΑΘΗΜΑΤΑ, not ΜΑΘΉΜΑΤΑ) — but only when the
  // browser knows the content language, so stamp it on the root and on our own tree.
  useEffect(() => { document.documentElement.lang = lang; }, [lang]);

  const liveRoster = rosterFor ? classes.find((c) => c.id === rosterFor.id) : null;
  const nameOf = (id) => { const m = members.find((x) => x.id === id); return m ? tx(m.name) : id; };

  return (
    <LangCtx.Provider value={ctx}>
      <div className="min-h-screen" lang={lang}>
        <header className="sticky top-0 z-40 h-[57px] border-b border-line bg-surface flex items-center gap-3 px-4">
          <div className="flex items-center gap-2.5 shrink-0">
            <span className="w-9 h-9 rounded-[8px] bg-volt text-voltink grid place-items-center display text-[13px] font-extrabold tracking-tight">PL</span>
            <div className="leading-none">
              <p className="display text-[14px] font-extrabold uppercase tracking-[.06em]">Power Life <span className="text-volt">Gym</span></p>
              <p className="text-[10px] text-mute mt-1">{t("brandTag")}</p>
            </div>
          </div>
          <div className="mx-auto hidden sm:block"><ViewSwitch view={view} setView={setView} /></div>
          <div className="flex items-center gap-2 shrink-0 ml-auto sm:ml-0">
            <span className="hidden md:inline-flex items-center gap-1.5 h-8 px-2.5 rounded-full bg-raised border border-line text-[11.5px] text-dim mono">
              <Icon name="clock" size={12} />{clock()}
            </span>
            <LangSwitch lang={lang} setLang={setLang} />
          </div>
        </header>
        <div className="sm:hidden px-4 py-2 border-b border-line bg-surface flex justify-center"><ViewSwitch view={view} setView={setView} /></div>

        {view === "client"
          ? <ClientView me={me} classes={classes} myBookings={myBookings} lastScan={lastScan} actions={actions} />
          : <StaffView page={page} setPage={setPage} atLoc={atLoc} setAtLoc={setAtLoc} members={members} classes={classes}
              scans={scans} checkinsToday={checkinsToday} muted={muted} setMuted={setMuted} actions={actions} />}

        {/* Upgrade / up-sell */}
        <Modal open={!!upgradeTo} onClose={() => setUpgradeTo(null)} icon="arrow-up-right"
          title={upgradeTo && upgradeTo.price < PLANS[me.plan].price ? t("changePlan") : t("upgradeTitle")}
          subtitle={t("upgradeSub")}
          footer={<>
            <Button variant="ghost" onClick={() => setUpgradeTo(null)}>{t("later")}</Button>
            <Button icon="zap" onClick={() => {
              patchMember(ME_ID, { plan: upgradeTo.id });
              toast(t("upgradeDone"), tx(upgradeTo.label) + " · " + euro(upgradeTo.price) + "/" + t("perMonth"));
              setUpgradeTo(null);
            }}>{t("upgradeCta")}</Button>
          </>}>
          {upgradeTo && (
            <div className="space-y-3">
              <div className="flex items-baseline justify-between">
                <h4 className="display text-[19px] font-extrabold">{tx(upgradeTo.label)}</h4>
                <span className="display text-[19px] font-extrabold tnum text-volt">{euro(upgradeTo.price)}<span className="text-[12px] text-dim font-bold"> /{t("perMonth")}</span></span>
              </div>
              <p className="text-[12.5px] text-dim">{tx(upgradeTo.sub)}</p>
              <div className="rounded-[9px] border border-line bg-raised p-3">
                <p className="eyebrow text-mute mb-2">{t("includes")}</p>
                <ul className="space-y-1.5">
                  {tx(upgradeTo.perks).map((p) => (
                    <li key={p} className="text-[12.5px] flex items-start gap-2"><Icon name="check" size={13} className="text-volt mt-0.5" strokeWidth={3} />{p}</li>
                  ))}
                </ul>
              </div>
            </div>
          )}
        </Modal>

        {/* Extend */}
        <Modal open={!!extendFor} onClose={() => setExtendFor(null)} icon="calendar-plus"
          title={extendFor ? t("extendTitle") + " · " + tx(extendFor.name) : ""}
          subtitle={extendFor ? extendFor.id + " · " + tx(PLANS[extendFor.plan].label) : ""}
          footer={<>
            <Button variant="ghost" onClick={() => setExtendFor(null)}>{t("cancel")}</Button>
            <Button icon="check" onClick={() => {
              patchMember(extendFor.id, { daysLeft: extendFor.daysLeft + extendDays, frozen: false });
              toast(t("extendedToast"), tx(extendFor.name) + " · +" + extendDays + " " + t("days"));
              setExtendFor(null);
            }}>{t("addDays")} {extendDays} {t("daysWord")}</Button>
          </>}>
          {extendFor && (
            <div className="space-y-3">
              <div className="grid grid-cols-3 gap-2">
                {[30, 90, 365].map((d) => (
                  <button key={d} onClick={() => setExtendDays(d)}
                    className={"h-16 rounded-[9px] border transition-colors " + (extendDays === d ? "border-volt bg-voltsoft text-volt" : "border-line bg-raised text-dim hover:text-ink")}>
                    <span className="display block text-[19px] font-extrabold">+{d}</span>
                    <span className="text-[11px]">{d === 365 ? t("oneYear") : t("days")}</span>
                  </button>
                ))}
              </div>
              <div className="rounded-[9px] bg-raised border border-line p-3 flex items-center justify-between text-[12px]">
                <span className="text-dim">{t("afterExt")}</span>
                <span className="mono font-semibold text-[14px]">{extendFor.daysLeft} → {extendFor.daysLeft + extendDays}</span>
              </div>
              {extendFor.frozen && <p className="text-[12px] text-froze flex items-start gap-2"><Icon name="snowflake" size={13} className="mt-0.5" />{t("extLiftsFreeze")}</p>}
            </div>
          )}
        </Modal>

        {/* Roster */}
        <Modal open={!!liveRoster} onClose={() => setRosterFor(null)} icon="clipboard-list" width="max-w-lg"
          title={liveRoster ? classTitle(liveRoster, tx) : ""}
          subtitle={liveRoster ? tx(TRAINERS[liveRoster.trainer]) + " · " + t(liveRoster.day) + " " + liveRoster.start + " · " + tx(LOCATIONS.find((l) => l.id === liveRoster.loc).tag) : ""}
          footer={<Button variant="quiet" onClick={() => setRosterFor(null)}>{t("closeRoster")}</Button>}>
          {liveRoster && (
            <div className="space-y-3">
              <div className="flex items-center justify-between text-[12px]">
                <span className="mono text-dim">{liveRoster.booked}/{liveRoster.cap} {t("bookedWord")} · {Math.max(0, liveRoster.cap - liveRoster.booked)} {t("openSpots")}</span>
                <span className="text-dim">{pct(liveRoster.booked, liveRoster.cap)}% {t("full")}</span>
              </div>
              <Meter value={liveRoster.booked} max={liveRoster.cap} tone={liveRoster.booked >= liveRoster.cap ? "bad" : "volt"} height="h-2" />
              <div className="border border-line rounded-[9px] divide-y divide-linesoft max-h-64 overflow-y-auto scroll-thin">
                {liveRoster.roster.length === 0 && <p className="p-4 text-[12.5px] text-dim text-center">{t("noBookings")}</p>}
                {liveRoster.roster.map((id, i) => (
                  <div key={id + i} className="flex items-center gap-2.5 px-3 py-2">
                    <Avatar name={nameOf(id)} size={28} />
                    <span className="text-[13px] flex-1">{nameOf(id)}{id === ME_ID && <span className="text-mute"> · {t("you")}</span>}</span>
                    <span className="mono text-[11px] text-mute">#{String(i + 1).padStart(2, "0")}</span>
                  </div>
                ))}
              </div>
              {liveRoster.booked > liveRoster.roster.length && (
                <p className="text-[11.5px] text-mute">{liveRoster.booked - liveRoster.roster.length} {t("deskBookings")}</p>
              )}
            </div>
          )}
        </Modal>

        {/* Member detail */}
        <Modal open={!!memberFor} onClose={() => setMemberFor(null)} icon="user" width="max-w-md"
          title={memberFor ? tx(memberFor.name) : ""} subtitle={memberFor ? memberFor.email : ""}
          footer={<>
            <Button variant="quiet" icon="snowflake" onClick={() => { actions.toggleFreeze(memberFor); setMemberFor(null); }}>
              {memberFor && memberFor.frozen ? t("unfreeze") : t("freeze")}
            </Button>
            <Button icon="calendar-plus" onClick={() => { const m = memberFor; setMemberFor(null); actions.openExtend(m); }}>{t("extend")}</Button>
          </>}>
          {memberFor && (
            <div className="space-y-3">
              <div className="flex items-center gap-3">
                <Avatar name={tx(memberFor.name)} size={48} />
                <div className="flex-1">
                  <StatusPill status={statusOf(memberFor)} />
                  <p className="mono text-[11.5px] text-mute mt-1.5">{memberFor.id}</p>
                </div>
              </div>
              <div className="grid grid-cols-2 gap-2">
                {[
                  [t("detailPlan"), tx(PLANS[memberFor.plan].label)],
                  [t("detailHome"), tx(LOCATIONS.find((l) => l.id === memberFor.home).tag)],
                  [t("detailDays"), memberFor.daysLeft + " " + t("days")],
                  [t("detailVisits"), String(memberFor.visits)],
                  [t("detailSince"), memberFor.joined],
                  [t("detailLast"), tx(memberFor.lastCheckIn)]
                ].map(([k, v]) => (
                  <div key={k} className="rounded-[9px] border border-line bg-raised px-3 py-2">
                    <p className="eyebrow text-mute">{k}</p>
                    <p className="text-[12.5px] font-medium mt-1">{v}</p>
                  </div>
                ))}
              </div>
              <div className="rounded-[9px] border border-line p-3">
                <p className="eyebrow text-mute mb-2">{t("doorResultAt")} {tx(LOCATIONS.find((l) => l.id === atLoc).tag)}</p>
                {(() => {
                  const v = evaluateAccess(memberFor, atLoc);
                  return (
                    <p className={"text-[13px] font-semibold flex items-start gap-2 " + (v.ok ? "text-good" : "text-bad")}>
                      <Icon name={v.ok ? "check-circle-2" : "x-circle"} size={15} className="mt-0.5" />
                      <span>{v.ok ? t("granted") : t("denied")}
                        <span className="font-normal text-dim"> — {reasonText(t, v, memberFor)}</span>
                      </span>
                    </p>
                  );
                })()}
              </div>
            </div>
          )}
        </Modal>

        <Toasts items={toasts} onDismiss={dismiss} />
      </div>
    </LangCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
