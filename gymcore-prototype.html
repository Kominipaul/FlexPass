const pascal = (n) => n.split("-").map((p) => p.charAt(0).toUpperCase() + p.slice(1)).join("");
function lookupIcon(name) {
  const L = window.lucide;
  if (!L) return null;
  const key = pascal(name);
  const bag = L.icons || L;
  return bag[key] || bag[name] || L[key] || L[name] || null;
}
const camel = (k) => k.replace(/-([a-z])/g, (_, c) => c.toUpperCase());

function Icon({ name, size = 16, strokeWidth = 2, className = "", title }) {
  const node = lookupIcon(name);
  const base = {
    width: size, height: size, viewBox: "0 0 24 24", fill: "none",
    stroke: "currentColor", strokeWidth, strokeLinecap: "round", strokeLinejoin: "round",
    className: "shrink-0 " + className, "aria-hidden": title ? undefined : true,
    role: title ? "img" : undefined, focusable: "false"
  };
  if (!node) return <svg {...base}><circle cx="12" cy="12" r="9" /></svg>;
  const parts = node[0] === "svg" ? node[2] : node;
  const children = (parts || []).map(([tag, attrs], i) => {
    const props = { key: i };
    Object.keys(attrs || {}).forEach((k) => { props[camel(k)] = attrs[k]; });
    return React.createElement(tag, props);
  });
  return <svg {...base}>{title ? <title>{title}</title> : null}{children}</svg>;
}

/** The access rule the door actually runs. */
function evaluateAccess(member, atLoc) {
  const plan = PLANS[member.plan];

    return { ok: false, headline: "Access denied", reason: "Account is frozen — unfreeze to check in", tag: "Frozen" };
  if (!plan.multiClub && member.home !== atLoc)
    return { ok: false, headline: "Access denied", reason: plan.label + " is valid at " + locName(member.home) + " only", tag: "Wrong club" };
  if (st === "expiring")
    return { ok: true, headline: "Access granted", reason: "Active — renews in " + member.daysLeft + " day" + (member.daysLeft === 1 ? "" : "s"), tag: "Expiring soon" };
  if (member.home !== atLoc)
    return { ok: true, headline: "Access granted", reason: "Cross-club access · " + plan.label, tag: "Visiting" };
  return { ok: true, headline: "Access granted", reason: "Active membership · " + plan.label, tag: plan.label };
}

function Meter({ value, max, tone = "accent", height = "h-1.5" }) {
  const p = Math.min(100, pct(value, max));

/* ============================================================================
   5. Rotating door pass — canvas QR built from the live token
   ========================================================================== */
function hashSeed(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function rng(seed) {
  let s = seed || 1;
  return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
}
function makeToken() {
  const alphabet = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  const block = () => Array.from({ length: 4 }, () => alphabet[Math.floor(Math.random() * alphabet.length)]).join("");
  return [block(), block(), block(), block()].join("-");
}

function QrCode({ token, px = 196 }) {
  const ref = useRef(null);
  useEffect(() => {
    const cv = ref.current;
    if (!cv) return;
    const dpr = window.devicePixelRatio || 1;
    const N = 29, quiet = 2, total = N + quiet * 2, cell = px / total;
    cv.width = px * dpr; cv.height = px * dpr;
    const ctx = cv.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0, 0, px, px);
    ctx.fillStyle = "#0B0E12";
    const rand = rng(hashSeed(token));
    const isFinder = (x, y) =>
      (x < 7 && y < 7) || (x >= N - 7 && y < 7) || (x < 7 && y >= N - 7) ||
      (x >= N - 9 && x <= N - 5 && y >= N - 9 && y <= N - 5);
    const dot = (x, y, on) => {
      if (!on) return;
      ctx.fillRect((x + quiet) * cell, (y + quiet) * cell, cell * 0.92, cell * 0.92);
    };
    for (let y = 0; y < N; y++)
      for (let x = 0; x < N; x++)
        if (!isFinder(x, y)) dot(x, y, rand() > 0.52);
    // timing lines + finder eyes, drawn as real QR anatomy
    for (let i = 8; i < N - 8; i++) { dot(i, 6, i % 2 === 0); dot(6, i, i % 2 === 0); }
    const eye = (ox, oy, size) => {
      ctx.fillRect((ox + quiet) * cell, (oy + quiet) * cell, cell * size, cell * size);
      ctx.fillStyle = "#FFFFFF";
      ctx.fillRect((ox + 1 + quiet) * cell, (oy + 1 + quiet) * cell, cell * (size - 2), cell * (size - 2));
      ctx.fillStyle = "#0B0E12";
      ctx.fillRect((ox + 2 + quiet) * cell, (oy + 2 + quiet) * cell, cell * (size - 4), cell * (size - 4));
    };
    eye(0, 0, 7); eye(N - 7, 0, 7); eye(0, N - 7, 7); eye(N - 9, N - 9, 5);
  }, [token, px]);
  return <canvas ref={ref} style={{ width: px, height: px }} className="block rounded-[4px]" aria-label="Door pass QR code" role="img" />;
}

function beep(kind, muted) {
  if (muted) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = new AC();
    const now = ctx.currentTime;
    const notes = kind === "granted" ? [[880, 0], [1320, 0.09]] : [[220, 0], [165, 0.12]];
    notes.forEach(([freq, at]) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = kind === "granted" ? "sine" : "square";
      osc.frequency.setValueAtTime(freq, now + at);
      gain.gain.setValueAtTime(0.0001, now + at);
      gain.gain.exponentialRampToValueAtTime(0.16, now + at + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + at + 0.16);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now + at); osc.stop(now + at + 0.2);
    });
    setTimeout(() => ctx.close(), 600);
  } catch (e) { /* audio unavailable — the visual indicator still fires */ }
}

function SoundBars({ active, tone }) {
  return (
    <span className="inline-flex items-end gap-[3px] h-4" aria-hidden="true">
      {[0, 1, 2, 3].map((i) => (
        <span key={i} style={{ animationDelay: i * 0.09 + "s", height: "100%" }}
          className={"w-[3px] rounded-full " + (tone === "granted" ? "bg-good" : "bg-bad") + (active ? " a-bar" : " opacity-30")} />
      ))}
    </span>
  );
}

function Scanner({ members, atLoc, onResult, muted, setMuted, scans }) {
  const [pick, setPick] = useState(members[0].id);
  const [phase, setPhase] = useState("idle"); // idle | scanning | result
  const [result, setResult] = useState(null);
  const timers = useRef([]);

  useEffect(() => () => timers.current.forEach(clearTimeout), []);

  const runScan = (memberId) => {
    const member = members.find((m) => m.id === memberId);
    if (!member) return;
    timers.current.forEach(clearTimeout);
    setPhase("scanning"); setResult(null);
    timers.current = [
      setTimeout(() => {
        const verdict = evaluateAccess(member, atLoc);
        const entry = {
          id: "s" + Date.now(), memberId: member.id, name: member.name, loc: atLoc,
          time: clock(), result: verdict.ok ? "granted" : "denied", reason: verdict.reason
        };
        setResult({ member, verdict, entry });
        setPhase("result");
        beep(verdict.ok ? "granted" : "denied", muted);
        onResult(entry);
      }, 950),
      setTimeout(() => setPhase("idle"), 6000)
    ];
  };

  const randomScan = () => {
    const m = members[Math.floor(Math.random() * members.length)];
    setPick(m.id);
    runScan(m.id);
  };

  const ok = result && result.verdict.ok;
  // Set the verdict tint directly: two competing bg-* utilities would resolve by
  // stylesheet order, not by the order they are written on the element.
  const panelTone = phase === "result"
    ? { background: ok ? "var(--good-soft)" : "var(--bad-soft)", borderColor: ok ? "var(--good)" : "var(--bad)" }
    : undefined;

  return (
    <div className="grid lg:grid-cols-[1fr_320px] gap-4">
      <Card className="relative overflow-hidden transition-colors duration-300" style={panelTone}>
        <div className="px-4 py-3 border-b border-linesoft flex items-center justify-between gap-3">
          <div className="flex items-center gap-2">
            <span className="w-7 h-7 rounded-[6px] bg-accentsoft text-accent grid place-items-center"><Icon name="scan-line" size={15} /></span>
            <div>
              <p className="display text-[14px] font-bold leading-none">Turnstile reader</p>
              <p className="text-[11px] text-mute mt-1">{locName(atLoc)} · lane 1</p>
            </div>
          </div>
          <button onClick={() => setMuted(!muted)} aria-pressed={!muted}
            className="inline-flex items-center gap-1.5 h-8 px-2.5 rounded-[6px] border border-line bg-surface text-[12px] text-dim hover:text-ink transition-colors">
            <Icon name={muted ? "volume-x" : "volume-2"} size={14} />{muted ? "Muted" : "Sound on"}
          </button>
        </div>

        <div className="p-5 min-h-[330px] grid place-items-center text-center">
          {phase === "idle" && (
            <div className="a-fade">
              <div className="relative w-28 h-28 mx-auto rounded-[12px] border-2 border-dashed border-line grid place-items-center text-mute">
                <Icon name="qr-code" size={40} strokeWidth={1.4} />
              </div>
              <p className="display text-[15px] font-bold mt-4">Waiting for a pass</p>
              <p className="text-[12px] text-dim mt-1 max-w-xs">Pick a member and scan, or simulate whoever walks up next.</p>
            </div>
          )}

          {phase === "scanning" && (
            <div className="a-fade">
              <div className="relative w-28 h-28 mx-auto rounded-[12px] border-2 border-accent overflow-hidden bg-raised grid place-items-center">
                <Icon name="qr-code" size={40} strokeWidth={1.4} className="text-accent opacity-70" />
                <span className="absolute left-0 right-0 h-[2px] bg-accent a-sweep shadow-[0_0_12px_var(--accent)]" />
              </div>
              <p className="display text-[15px] font-bold mt-4 flex items-center justify-center gap-2">
                <Icon name="loader-2" size={15} className="a-spin" />Reading token…
              </p>
              <p className="mono text-[12px] text-dim mt-1">Verifying rotation window</p>
            </div>
          )}

          {phase === "result" && result && (
            <div className="a-pop w-full">
              <div className={"w-16 h-16 mx-auto rounded-full grid place-items-center " + (ok ? "bg-good text-white" : "bg-bad text-white")}>
                <Icon name={ok ? "check" : "x"} size={34} strokeWidth={3.2} />
              </div>
              <h2 className={"display text-[30px] sm:text-[38px] font-extrabold uppercase tracking-tight mt-4 leading-none " + (ok ? "text-good" : "text-bad")}>
                {result.verdict.headline}
              </h2>
              <p className="text-[13px] text-ink font-medium mt-2">{result.verdict.reason}</p>

              <div className="flex items-center justify-center gap-2 mt-3">
                <SoundBars active tone={ok ? "granted" : "denied"} />
                <span className="text-[11px] text-dim">{ok ? "Two-tone chime · turnstile released" : "Low buzzer · turnstile held"}</span>
              </div>

              <div className="mt-5 inline-flex items-center gap-3 px-3 py-2.5 rounded-[8px] bg-surface border border-line text-left">
                <span className="w-9 h-9 rounded-full bg-raised border border-line grid place-items-center display text-[12px] font-bold">{initials(result.member.name)}</span>
                <div>
                  <p className="text-[13px] font-semibold leading-tight">{result.member.name}</p>
                  <p className="mono text-[11px] text-mute">{result.member.id} · {PLANS[result.member.plan].label}</p>
                </div>
                <StatusPill status={statusOf(result.member)} size="sm" />
              </div>
            </div>
          )}
        </div>

        <div className="p-4 border-t border-linesoft bg-raised flex flex-col sm:flex-row gap-2">
          <div className="flex-1">
            <Select value={pick} onChange={(e) => setPick(e.target.value)} aria-label="Choose a member to scan">
              {members.map((m) => (
                <option key={m.id} value={m.id}>{m.name} · {m.id} · {STATUS_META[statusOf(m)].label}</option>
              ))}
            </Select>
          </div>
          <Button icon="scan-line" onClick={() => runScan(pick)} disabled={phase === "scanning"}>Scan pass</Button>
          <Button variant="quiet" icon="shuffle" onClick={randomScan} disabled={phase === "scanning"}>Simulate member scan</Button>
        </div>
      </Card>

      <Card className="flex flex-col">
        <div className="px-4 py-3 border-b border-linesoft flex items-center justify-between">
          <h3 className="display text-[14px] font-bold">Door log</h3>
          <span className="mono text-[11px] text-mute">{scans.length}</span>
        </div>
        <div className="divide-y divide-linesoft overflow-y-auto scroll-thin max-h-[420px]">
          {scans.map((s) => (
            <div key={s.id} className="px-4 py-2.5 flex items-start gap-2.5">
              <span className={"w-6 h-6 rounded-full grid place-items-center shrink-0 " + (s.result === "granted" ? "bg-goodsoft text-good" : "bg-badsoft text-bad")}>
                <Icon name={s.result === "granted" ? "check" : "x"} size={13} strokeWidth={3} />
              </span>
              <div className="min-w-0 flex-1">
                <p className="text-[13px] font-medium truncate">{s.name}</p>
                <p className="text-[11px] text-dim truncate">{s.reason}</p>
              </div>
              <div className="text-right shrink-0">
                <p className="mono text-[11px]">{s.time}</p>
                <p className="text-[10px] text-mute">{locShort(s.loc)}</p>
              </div>
            </div>
          ))}
        </div>
      </Card>
    </div>
  );
}

function barPath(x, y, w, h, r) {
  const rr = Math.max(0, Math.min(r, w / 2, h));
  return "M" + x + "," + (y + h) + "V" + (y + rr) + "a" + rr + "," + rr + " 0 0 1 " + rr + ",-" + rr +
         "h" + (w - 2 * rr) + "a" + rr + "," + rr + " 0 0 1 " + rr + "," + rr + "V" + (y + h) + "Z";
}

function ChartTooltip({ x, y, children }) {
  return (
    <div className="pointer-events-none absolute z-20 -translate-x-1/2 -translate-y-full px-2.5 py-1.5 rounded-[6px] bg-surface border border-line shadow-lift text-[11.5px] whitespace-nowrap"
      style={{ left: x, top: y - 8 }}>
      {children}
    </div>
  );
}

function PeakHoursChart({ data, scope }) {
  const [hover, setHover] = useState(null);
  const W = 720, H = 190, padL = 30, padR = 8, padT = 14, padB = 26;
  const vals = data.map((d) => (scope === "all" ? d.dth + d.nsb : d[scope]));
  const max = Math.max(...vals, 1);
  const peakIdx = vals.indexOf(Math.max(...vals));
  const iw = (W - padL - padR) / data.length;
  const bw = iw - 4;
  const ticks = [0, Math.round(max / 2), max];

  return (
    <div className="relative">
      <svg viewBox={"0 0 " + W + " " + H} className="w-full h-[190px]" role="img"
        aria-label="Check-ins by hour of day">
        {ticks.map((t) => {
          const y = padT + (1 - t / max) * (H - padT - padB);
          return (
            <g key={t}>
              <line x1={padL} x2={W - padR} y1={y} y2={y} stroke="var(--grid)" strokeWidth="1" />
              <text x={padL - 6} y={y + 3.5} textAnchor="end" fontSize="9.5" fill="var(--mute)" className="mono">{t}</text>
            </g>
          );
        })}
        {data.map((d, i) => {
          const v = vals[i];
          const h = (v / max) * (H - padT - padB);
          const x = padL + i * iw + 2;
          const y = padT + (H - padT - padB - h);
          const isPeak = i === peakIdx;
          return (
            <g key={d.hour} onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover(null)}>
              <rect x={padL + i * iw} y={padT} width={iw} height={H - padT - padB} fill="transparent" />
              <path d={barPath(x, y, bw, h, 4)} fill="var(--s1)" opacity={hover === null || hover === i ? (isPeak ? 1 : 0.72) : 0.34}
                style={{ transition: "opacity .15s" }} />
              {isPeak && <text x={x + bw / 2} y={y - 5} textAnchor="middle" fontSize="10" fontWeight="700" fill="var(--ink)" className="mono">{v}</text>}
              {i % 3 === 0 && <text x={x + bw / 2} y={H - 8} textAnchor="middle" fontSize="9.5" fill="var(--mute)" className="mono">{String(d.hour).padStart(2, "0")}</text>}
            </g>
          );
        })}
      </svg>
      {hover !== null && (
        <ChartTooltip x={((padL + hover * iw + iw / 2) / W) * 100 + "%"} y={40}>
          <span className="mono font-semibold">{String(data[hover].hour).padStart(2, "0")}:00</span>
          <span className="text-dim"> · </span>
          <span className="mono">{vals[hover]} check-ins</span>
        </ChartTooltip>
      )}
    </div>
  );
}

function WeekChart({ data }) {
  const [hover, setHover] = useState(null);
  const W = 720, H = 190, padL = 34, padR = 8, padT = 20, padB = 26;
  const max = Math.max(...data.map((d) => Math.max(d.dth, d.nsb)), 1);
  const gw = (W - padL - padR) / data.length;
  const bw = (gw - 10) / 2;
  const ticks = [0, Math.round(max / 2), max];

  return (
    <div className="relative">
      <div className="flex items-center gap-4 mb-1.5">
        {LOCATIONS.map((l, i) => (
          <span key={l.id} className="inline-flex items-center gap-1.5 text-[11.5px] text-dim">
            <span className="w-2.5 h-2.5 rounded-[2px]" style={{ background: i === 0 ? "var(--s1)" : "var(--s2)" }} />{l.name}
          </span>
        ))}
      </div>
      <svg viewBox={"0 0 " + W + " " + H} className="w-full h-[190px]" role="img" aria-label="Check-ins over the last seven days by location">
        {ticks.map((t) => {
          const y = padT + (1 - t / max) * (H - padT - padB);
          return (
            <g key={t}>
              <line x1={padL} x2={W - padR} y1={y} y2={y} stroke="var(--grid)" strokeWidth="1" />
              <text x={padL - 6} y={y + 3.5} textAnchor="end" fontSize="9.5" fill="var(--mute)" className="mono">{t}</text>
            </g>
          );
        })}
        {data.map((d, i) => {
          const base = padL + i * gw + 5;
          const last = i === data.length - 1;
          return (
            <g key={d.day} onMouseEnter={() => setHover(i)} onMouseLeave={() => setHover(null)}>
              <rect x={padL + i * gw} y={padT} width={gw} height={H - padT - padB} fill="transparent" />
              {[["dth", "var(--s1)", 0], ["nsb", "var(--s2)", bw + 2]].map(([key, color, off]) => {
                const h = (d[key] / max) * (H - padT - padB);
                const y = padT + (H - padT - padB - h);
                return (
                  <g key={key}>
                    <path d={barPath(base + off, y, bw, h, 4)} fill={color} opacity={hover === null || hover === i ? 1 : 0.35} style={{ transition: "opacity .15s" }} />
                    {last && <text x={base + off + bw / 2} y={y - 5} textAnchor="middle" fontSize="10" fontWeight="700" fill="var(--ink)" className="mono">{d[key]}</text>}
                  </g>
                );
              })}
              <text x={base + bw + 1} y={H - 8} textAnchor="middle" fontSize="9.5" fill="var(--mute)">{d.day}</text>
            </g>
          );
        })}
      </svg>
      {hover !== null && (
        <ChartTooltip x={((padL + hover * gw + gw / 2) / W) * 100 + "%"} y={54}>
          <span className="font-semibold">{data[hover].day}</span>
          <span className="mono block text-dim">{locShort("dth")} {data[hover].dth} · {locShort("nsb")} {data[hover].nsb}</span>
        </ChartTooltip>
      )}
    </div>
  );
}

function MetricCard({ icon, label, value, unit, sub, tone = "accent", children }) {

function useTheme() {
  const [mode, setMode] = useState(() => document.documentElement.getAttribute("data-theme"));
  const resolved = mode || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const toggle = () => {
    const next = resolved === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    setMode(next);
  };
  return [resolved, toggle];
}

function App() {
  const [view, setView] = useState("client");
  const [page, setPage] = useState("scanner");
  const [atLoc, setAtLoc] = useState("dth");
  const [theme, toggleTheme] = useTheme();
  const [muted, setMuted] = useState(false);

  const [members, setMembers] = useState(MEMBER_SEED);
  const [classes, setClasses] = useState(CLASS_SEED);
  const [scans, setScans] = useState(SCAN_SEED);
  const [toasts, setToasts] = useState([]);
  const [extendFor, setExtendFor] = useState(null);
  const [extendDays, setExtendDays] = useState(30);
  const [rosterFor, setRosterFor] = useState(null);
  const [memberFor, setMemberFor] = useState(null);

  const me = members.find((m) => m.id === ME_ID);
  const myBookings = useMemo(() => classes.filter((c) => c.roster.includes(me.name)).map((c) => c.id), [classes, me.name]);
  const lastScan = useMemo(() => scans.find((s) => s.memberId === ME_ID), [scans]);

  const baseCheckins = useMemo(() => HOURLY_SEED.reduce((a, d) => a + (atLoc === "all" ? d.dth + d.nsb : d[atLoc]), 0), [atLoc]);
  const liveGrants = scans.filter((s) => s.live && s.result === "granted" && s.loc === atLoc).length;
  const checkinsToday = baseCheckins + liveGrants;

  const toast = useCallback((title, body, tone) => {
    const id = Math.random().toString(36).slice(2);
    setToasts((t) => [...t, { id, title, body, tone }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 3600);
  }, []);
  const dismiss = (id) => setToasts((t) => t.filter((x) => x.id !== id));
  const patchMember = (id, patch) => setMembers((ms) => ms.map((m) => (m.id === id ? { ...m, ...patch } : m)));

  const actions = {
    /* member portal */
    freeze: (weeks) => {
      patchMember(ME_ID, { frozen: true });
      toast("Membership frozen", "Paused for " + weeks + " weeks — unfreeze any time.", "warn");
    },
    unfreeze: () => {
      patchMember(ME_ID, { frozen: false });
      toast("Membership active again", "Door access restored at both clubs.");
    },
    renew: () => {
      patchMember(ME_ID, { daysLeft: me.daysLeft + 30 });
      toast("Renewed 30 days", "Visa ·· 4417 charged $" + PLANS[me.plan].price + ".");
    },
    toggleBooking: (classId) => {
      setClasses((cs) => cs.map((c) => {
        if (c.id !== classId) return c;
        const booked = c.roster.includes(me.name);
        if (booked) {
          toast("Booking cancelled", c.name + " · " + c.day + " " + c.start, "warn");
          return { ...c, booked: Math.max(0, c.booked - 1), roster: c.roster.filter((n) => n !== me.name) };
        }
        if (c.booked >= c.cap) {
          toast("Added to waitlist", c.name + " is full — you're next in line.", "warn");
          return c;
        }
        toast("Spot booked", c.name + " · " + c.day + " " + c.start + " · " + locName(c.loc));
        return { ...c, booked: c.booked + 1, roster: [...c.roster, me.name] };
      }));
    },
    /* staff */
    logScan: (entry) => {
      setScans((s) => [{ ...entry, live: true }, ...s].slice(0, 40));
      if (entry.result === "granted") patchMember(entry.memberId, { lastCheckIn: "Today · " + entry.time });
    },
    openExtend: (m) => { setExtendDays(30); setExtendFor(m); },
    toggleFreeze: (m) => {
      patchMember(m.id, { frozen: !m.frozen });
      toast(m.frozen ? "Account unfrozen" : "Account frozen", m.name + " · " + m.id, m.frozen ? "good" : "warn");
    },
    openMember: (m) => setMemberFor(m),
    addClass: (draft) => {
      const id = "c" + Date.now();
      setClasses((cs) => [...cs, { ...draft, id, booked: 0, roster: [] }]);
      toast("Class published", draft.name + " · " + draft.day + " " + draft.start + " · " + locName(draft.loc));
    },
    dropClass: (id) => {
      const c = classes.find((x) => x.id === id);
      setClasses((cs) => cs.filter((x) => x.id !== id));
      toast("Class cancelled", c.name + " — " + c.booked + " member" + (c.booked === 1 ? "" : "s") + " notified.", "warn");
    },
    openRoster: (c) => setRosterFor(c)
  };

  const liveRoster = rosterFor ? classes.find((c) => c.id === rosterFor.id) : null;

  return (
    <div className="min-h-screen">
      <header className="sticky top-0 z-40 h-[57px] border-b border-line bg-surface backdrop-blur flex items-center gap-3 px-4">
        <div className="flex items-center gap-2 shrink-0">
          <span className="w-8 h-8 rounded-[7px] bg-ink text-ground grid place-items-center">
            <Icon name="dumbbell" size={17} strokeWidth={2.4} />
          </span>
          <div className="leading-none">
            <p className="display text-[15px] font-extrabold tracking-tight">GYMCORE</p>
            <p className="text-[10.5px] text-mute mt-0.5">2 clubs · 1 pass</p>
          </div>
        </div>

        <div className="mx-auto"><ViewSwitch view={view} setView={setView} /></div>

        <div className="flex items-center gap-2 shrink-0">
          <span className="hidden sm:inline-flex items-center gap-1.5 h-8 px-2.5 rounded-full bg-raised border border-line text-[11.5px] text-dim mono">
            <Icon name="clock" size={12} />{clock()}
          </span>
          <button onClick={toggleTheme} aria-label="Switch theme"
            className="w-8 h-8 grid place-items-center rounded-[6px] border border-line bg-surface text-dim hover:text-ink transition-colors">
            <Icon name={theme === "dark" ? "sun" : "moon"} size={15} />
          </button>
        </div>
      </header>

      {view === "client" ? (
        <ClientView me={me} classes={classes} myBookings={myBookings} lastScan={lastScan}
          onToggleBooking={actions.toggleBooking} actions={actions} />
      ) : (
        <StaffView page={page} setPage={setPage} atLoc={atLoc} setAtLoc={setAtLoc}
          members={members} classes={classes} scans={scans} checkinsToday={checkinsToday}
          muted={muted} setMuted={setMuted} actions={actions} />
      )}

      {/* Extend membership */}
      <Modal open={!!extendFor} onClose={() => setExtendFor(null)} icon="calendar-plus"
        title={extendFor ? "Extend " + extendFor.name : ""} subtitle={extendFor ? extendFor.id + " · " + PLANS[extendFor.plan].label : ""}
        footer={<>
          <Button variant="ghost" onClick={() => setExtendFor(null)}>Cancel</Button>
          <Button icon="check" onClick={() => {
            patchMember(extendFor.id, { daysLeft: extendFor.daysLeft + extendDays, frozen: false });
            toast("Membership extended", extendFor.name + " · +" + extendDays + " days");
            setExtendFor(null);
          }}>Add {extendDays} days</Button>
        </>}>
        {extendFor && (
          <div className="space-y-3">
            <div className="grid grid-cols-3 gap-2">
              {[30, 90, 365].map((d) => (
                <button key={d} onClick={() => setExtendDays(d)}
                  className={"h-16 rounded-[8px] border transition-colors " + (extendDays === d ? "border-accent bg-accentsoft text-accent" : "border-line bg-raised text-dim hover:text-ink")}>
                  <span className="display block text-[19px] font-bold">+{d}</span>
                  <span className="text-[11px]">{d === 365 ? "one year" : "days"}</span>
                </button>
              ))}
            </div>
            <div className="rounded-[8px] bg-raised border border-line p-3 flex items-center justify-between text-[12px]">
              <span className="text-dim">Days remaining after extension</span>
              <span className="mono font-semibold text-[14px]">{extendFor.daysLeft} → {extendFor.daysLeft + extendDays}</span>
            </div>
            {extendFor.frozen && (
              <p className="text-[12px] text-froze flex items-start gap-2"><Icon name="snowflake" size={13} className="mt-0.5" />Extending also lifts the freeze on this account.</p>
            )}
          </div>
        )}
      </Modal>

      {/* Class roster */}
      <Modal open={!!liveRoster} onClose={() => setRosterFor(null)} icon="clipboard-list" width="max-w-lg"
        title={liveRoster ? liveRoster.name : ""}
        subtitle={liveRoster ? liveRoster.trainer + " · " + liveRoster.day + " " + liveRoster.start + " · " + locName(liveRoster.loc) : ""}
        footer={<Button variant="quiet" onClick={() => setRosterFor(null)}>Close roster</Button>}>
        {liveRoster && (
          <div className="space-y-3">
            <div className="flex items-center justify-between text-[12px]">
              <span className="mono text-dim">{liveRoster.booked}/{liveRoster.cap} booked · {Math.max(0, liveRoster.cap - liveRoster.booked)} open</span>
              <span className="text-dim">{pct(liveRoster.booked, liveRoster.cap)}% full</span>
            </div>
            <Meter value={liveRoster.booked} max={liveRoster.cap} tone={liveRoster.booked >= liveRoster.cap ? "bad" : "accent"} height="h-2" />
            <div className="border border-line rounded-[8px] divide-y divide-linesoft max-h-64 overflow-y-auto scroll-thin">
              {liveRoster.roster.length === 0 && <p className="p-4 text-[12.5px] text-dim text-center">No one has booked yet.</p>}
              {liveRoster.roster.map((n, i) => (
                <div key={n + i} className="flex items-center gap-2.5 px-3 py-2">
                  <span className="w-7 h-7 rounded-full bg-raised border border-line grid place-items-center display text-[10.5px] font-bold">{initials(n)}</span>
                  <span className="text-[13px] flex-1">{n}{n === me.name && <span className="text-mute"> · you</span>}</span>
                  <span className="mono text-[11px] text-mute">#{String(i + 1).padStart(2, "0")}</span>
                </div>
              ))}
            </div>
            {liveRoster.booked > liveRoster.roster.length && (
              <p className="text-[11.5px] text-mute">{liveRoster.booked - liveRoster.roster.length} booking(s) made at the desk are not named on this roster.</p>
            )}
          </div>
        )}
      </Modal>

      {/* Member detail */}
      <Modal open={!!memberFor} onClose={() => setMemberFor(null)} icon="user" width="max-w-md"
        title={memberFor ? memberFor.name : ""} subtitle={memberFor ? memberFor.email : ""}
        footer={<>
          <Button variant="quiet" icon="snowflake" onClick={() => { actions.toggleFreeze(memberFor); setMemberFor(null); }}>
            {memberFor && memberFor.frozen ? "Unfreeze" : "Freeze"}
          </Button>
          <Button icon="calendar-plus" onClick={() => { const m = memberFor; setMemberFor(null); actions.openExtend(m); }}>Extend</Button>
        </>}>
        {memberFor && (
          <div className="space-y-3">
            <div className="flex items-center gap-3">
              <span className="w-12 h-12 rounded-full bg-raised border border-line grid place-items-center display text-[15px] font-bold">{initials(memberFor.name)}</span>
              <div className="flex-1">
                <StatusPill status={statusOf(memberFor)} />
                <p className="mono text-[11.5px] text-mute mt-1">{memberFor.id}</p>
              </div>
            </div>
            <div className="grid grid-cols-2 gap-2">
              {[
                ["Plan", PLANS[memberFor.plan].label], ["Home club", locName(memberFor.home)],
                ["Days left", memberFor.daysLeft + " days"], ["Lifetime visits", String(memberFor.visits)],
                ["Member since", memberFor.joined], ["Last scan", memberFor.lastCheckIn]
              ].map(([k, v]) => (
                <div key={k} className="rounded-[8px] border border-line bg-raised px-3 py-2">
                  <p className="eyebrow text-mute">{k}</p>
                  <p className="text-[12.5px] font-medium mt-1">{v}</p>
                </div>
              ))}
            </div>
            <div className="rounded-[8px] border border-line p-3">
              <p className="eyebrow text-mute mb-2">Door result if scanned at {locName(atLoc)}</p>
              {(() => {
                const v = evaluateAccess(memberFor, atLoc);
                return (
                  <p className={"text-[13px] font-semibold flex items-center gap-2 " + (v.ok ? "text-good" : "text-bad")}>
                    <Icon name={v.ok ? "check-circle-2" : "x-circle"} size={15} />{v.headline}
                    <span className="font-normal text-dim">— {v.reason}</span>
                  </p>
                );
              })()}
            </div>
          </div>
        )}
      </Modal>

      <Toasts items={toasts} onDismiss={dismiss} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
